
apiVersion: v1
kind: Pod
metadata:
  name: logging-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Lab13 log entry' > /mnt/app-logs/app.log && sleep 3600"]
      volumeMounts:
        - name: app-logs
          mountPath: /mnt/app-logs
  volumes:
    - name: app-logs
      persistentVolumeClaim:
        claimName: ivolvepvc

