
- name: Install Docker, Kubectl and Jenkins
  hosts: managed
  become: yes

  tasks:

    # Install Docker
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    # Install prerequisites
    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - fontconfig
          - openjdk-21-jre
        state: present
        update_cache: yes

    # Create keyrings directory
    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    # Add Kubernetes repository key
    - name: Download Kubernetes repository key
      get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'

    # Add Kubernetes repository
    - name: Add Kubernetes repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /"
        state: present
        filename: kubernetes

    # Install Kubectl
    - name: Install Kubectl
      apt:
        name: kubectl
        state: present
        update_cache: yes

    # Add Jenkins repository key
    - name: Download Jenkins repository key
      get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: '0644'

    # Add Jenkins repository
    - name: Add Jenkins repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    # Install Jenkins
    - name: Install Jenkins
      apt:
        name: jenkins
        state: present
        update_cache: yes
